# Site configuration. Live at https://thrivecare.ca (see static/CNAME).
baseURL = "https://thrivecare.ca/"
locale = "en-CA"
disableKinds = ["taxonomy", "term", "RSS"]
title = "ThriveCare"
theme = "thrivecare"
enableRobotsTXT = true

[params]
  description = "ThriveCare offers supportive, medically guided weight loss care, focused on your whole health, without judgement. (Draft description: edit me.)"
  tagline = "Medical weight loss"   # text tagline; menopause care is coming soon (the logo artwork is unchanged)
  # --- PLACEHOLDER CONTACT DETAILS: replace before launch ---
  email = "hello@example.com"
  emailNote = "Placeholder email: edit me"
  phone = "(000) 000-0000"
  phoneNote = "Placeholder phone: edit me"
  address = "Ontario-based · Virtual appointments"
  hours = "Hours (edit me)"
  bookingURL = ""   # e.g. an online booking link; leave empty to send people to the Contact page
  disclaimer = "PLACEHOLDER DISCLAIMER (edit me; have it reviewed): Information on this website is general in nature and is not medical advice. It does not replace an individual assessment by a qualified health care professional. If you have an urgent medical concern, call 911 or go to your nearest emergency department."

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Weight optimization"
    pageRef = "/weight-optimization"
    weight = 20
  [[menus.main]]
    name = "About us"
    pageRef = "/about"
    weight = 40
  [[menus.main]]
    name = "Menopause"
    pageRef = "/menopause"
    weight = 30
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50

[markup.goldmark.renderer]
  unsafe = false

[minify.tdewolff.html]
  keepWhitespace = false
