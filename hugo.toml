# Site configuration. Live at https://thrivecare.ca (see static/CNAME).
baseURL = "https://thrivecare.ca/"
locale = "en-CA"
disableKinds = ["taxonomy", "term", "RSS"]
title = "ThriveCare"
theme = "thrivecare"
enableRobotsTXT = true

[params]
  description = "Personalized, evidence-based medical weight management and weight loss care for adults in Ontario, delivered virtually by a nurse practitioner."
  tagline = "Medical Weight Management in Ontario"   # text tagline; menopause care is coming soon (the logo artwork is unchanged)
  # --- PLACEHOLDER CONTACT DETAILS: replace before launch ---
  email = "info@thrivecare.ca"
  emailNote = ""
  phone = ""   # leave empty to hide the phone number
  phoneNote = ""
  address = "Ontario-based · Virtual appointments"
  hours = ""   # leave empty to hide hours
  bookingURL = ""   # e.g. an online booking link; leave empty to send people to the Contact page
  disclaimer = "Information on this website is general in nature and is not medical advice. It does not replace an individual assessment by a qualified health care professional. If you have an urgent medical concern, call 911 or go to your nearest emergency department."

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Weight management"
    pageRef = "/weight-management"
    weight = 20
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40
  [[menus.main]]
    name = "Menopause"
    pageRef = "/menopause"
    weight = 30
  [[menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50

[markup.goldmark.renderer]
  unsafe = false

[minify.tdewolff.html]
  keepWhitespace = false
