<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <img src="{{ "images/logo-horizontal.svg" | relURL }}" alt="ThriveCare home" width="220" height="47">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bars" aria-hidden="true"></span><span class="nav-toggle-label">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {{ $current := . }}
        {{ range site.Menus.main }}
          {{ $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}
          {{ if and .Page (eq .Page $current) }}{{ $active = true }}{{ end }}
          <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
        <li class="nav-cta-item"><a class="btn btn-small" href="{{ with site.Params.bookingURL }}{{ . }}{{ else }}{{ "contact/" | relURL }}{{ end }}">Book a consultation</a></li>
      </ul>
    </nav>
  </div>
</header>
