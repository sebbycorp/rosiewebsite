<!doctype html>
<html lang="{{ site.Language.Locale | default "en-CA" }}" class="no-js">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {{ partial "header.html" . }}
  <main id="main" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    (function () {
      var d = document.documentElement; d.classList.remove('no-js'); d.classList.add('js');
      var b = document.querySelector('.nav-toggle'), n = document.getElementById('site-nav');
      if (!b || !n) return;
      b.addEventListener('click', function () {
        var open = b.getAttribute('aria-expanded') === 'true';
        b.setAttribute('aria-expanded', String(!open)); n.classList.toggle('is-open', !open);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && n.classList.contains('is-open')) { b.click(); b.focus(); }
      });
    })();
  </script>
</body>
</html>
