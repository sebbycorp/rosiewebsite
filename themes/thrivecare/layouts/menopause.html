{{ define "main" }}
{{- /* "Coming soon" page: deliberately no booking button or CTA band. */ -}}
<section class="page-header">
  <img class="page-header-leaf" src="{{ "images/leaf-mark.svg" | relURL }}" alt="" width="260" height="260" aria-hidden="true">
  <div class="container">
    <p class="label-lined"><span>Coming soon</span></p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.intro }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</section>
<section class="section section-tight">
  <div class="container">
    <figure class="infographic">
      <picture>
        <source type="image/webp" srcset="{{ "images/menopause-symptoms.webp" | relURL }}">
        <img src="{{ "images/menopause-symptoms.jpg" | relURL }}" width="1536" height="1024" loading="lazy" decoding="async" alt="Common symptoms of perimenopause and menopause, including hot flashes, night sweats, sleep disturbances, fatigue, brain fog, mood swings, anxiety and depression, weight gain, joint pain, headaches, irregular periods, loss of libido and vaginal dryness">
      </picture>
    </figure>
  </div>
</section>
<section class="section">
  <div class="container soon-card">
    <div class="arch arch-sage" aria-hidden="true"><img src="{{ "images/leaf-mark.svg" | relURL }}" alt="" width="80" height="80"></div>
    <div class="prose">
      {{ .Content }}
      <p><a class="text-link" href="{{ "contact/" | relURL }}">Get in touch to hear when it's available <span aria-hidden="true">&rarr;</span></a></p>
    </div>
  </div>
</section>
{{ end }}
