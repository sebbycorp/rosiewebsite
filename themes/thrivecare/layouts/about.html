{{ define "main" }}
{{ partial "page-header.html" . }}
{{ with .Params.founder }}
<section class="section founder-section" id="founder" aria-labelledby="founder-heading">
  <div class="container founder">
    <div class="arch-frame arch-frame-lg">
      <img class="arch-photo" src="{{ .photo | relURL }}" alt="{{ .photo_alt }}" width="400" height="520">
    </div>
    <div class="founder-copy">
      <p class="kicker kicker-lg">Meet your provider</p>
      <h2 id="founder-heading">{{ .name }}</h2>
      <p class="founder-title">{{ .title }}</p>
      <div class="prose">{{ .bio | markdownify }}</div>
    </div>
  </div>
</section>
{{ end }}
<section class="section">
  <div class="container"><div class="prose">{{ .Content }}</div></div>
</section>
{{ partial "cta.html" . }}
{{ end }}
