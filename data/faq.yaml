- q: "Who is ThriveCare for?"
  a: "Draft answer (edit me): describe who you support, for example adults who want medically guided help with weight loss."
- q: "Can you help with menopause symptoms as well as weight?"
  a: "Draft answer (edit me): menopause and perimenopause care is coming soon. For now, ThriveCare focuses on medical weight loss. [Learn more about menopause care](/menopause/)."
- q: "Do I need a referral?"
  process: true
  a: "No, you do not need a referral. You can start with a complimentary 15‑minute virtual meet and greet. If you have a primary care provider, we are happy to collaborate with them to support your weight loss goals."
- q: "Are visits virtual?"
  process: true
  a: "All of our appointments are virtual, so you can meet with us from the comfort of home. ThriveCare is based in Ontario."
- q: "How much does it cost, and is it covered?"
  process: true
  a: "Nurse practitioner visits aren't covered by OHIP, so our visits are paid privately, though they may be covered under your extended health benefits. Please check with your benefits provider to see what your plan includes. Lab work we order is covered by OHIP, and medication costs are separate and may be covered by private benefits or paid out of pocket. You'll find details about each visit in our [Fees section](/weight-optimization/#fees)."
- q: "Can you prescribe medication?"
  process: true
  a: "Yes. As a nurse practitioner, I can prescribe medication when it's clinically appropriate. If medication is right for you, I'll talk through your options with you and include it in your personal plan."
- q: "How does ThriveCare protect my privacy?"
  process: true
  a: "We take your privacy seriously. All consultations are confidential, and we follow Canadian and provincial privacy laws to protect your personal health information."
- q: "What happens at my first appointment?"
  process: true
  a: "Your first visit is a 45‑minute virtual appointment where we review your medical history, set your goals together, order lab work if indicated, and build your personal plan."
- q: "Is this a diet program?"
  process: true
  a: "Draft answer (edit me): explain your approach, for example that care is personalised and focused on long-term health rather than quick fixes or strict rules."
