# ---------------------------------------------------------------
# Frequently asked questions (DRAFT). All are shown on the Home page.
# Questions with process: true are also shown on the Weight management page.
# Answers support Markdown links, e.g. [text](/menopause/).
# Replace every answer with confirmed information before launch.
# ---------------------------------------------------------------
- q: "Who is ThriveCare for?"
  a: "Adults in Ontario, both men and women, who want personalized, medically guided care for weight loss, weight maintenance and metabolic health."
- q: "Can you help with menopause symptoms as well as weight?"
  a: "Menopause and perimenopause care is coming soon. For now, ThriveCare focuses on medical weight management, and for women, care may consider changes in weight and body composition during perimenopause and menopause. [Learn more about menopause care](/menopause/)."
- q: "Do I need a referral?"
  process: true
  a: "No, you do not need a referral. You can start with a complimentary 15‑minute virtual meet and greet. If you have a primary care provider, collaboration with them to support your goals is always welcome."
- q: "Are visits virtual?"
  process: true
  a: "All appointments are virtual, so you can meet with your nurse practitioner from the comfort of home. ThriveCare is based in Ontario."
- q: "How much does it cost, and is it covered?"
  process: true
  a: "Nurse practitioner visits aren't covered by OHIP, so visits are paid privately, though they may be covered under your extended health benefits. Please check with your benefits provider to see what your plan includes. Bloodwork is covered by OHIP, and medication costs are separate and may be covered by private benefits or paid out of pocket. You'll find details about each visit in the [Fees section](/weight-management/#fees)."
- q: "Can you prescribe medication?"
  process: true
  a: "Yes. Nurse practitioners in Ontario can prescribe medication. If medication is clinically appropriate for you, your options will be discussed together and included in your personal plan."
- q: "How does ThriveCare protect my privacy?"
  process: true
  a: "Your privacy is taken seriously. All consultations are confidential, and ThriveCare follows Canadian and provincial privacy laws to protect your personal health information."
- q: "What happens at my first appointment?"
  process: true
  a: "Your first visit is a 45‑minute virtual appointment to review your medical history, set your goals together, arrange any bloodwork you may need, and build your personal plan."
- q: "Is this a quick-fix program?"
  process: true
  a: "No. There are no one-size-fits-all protocols and no automatic prescriptions. Care is personalized and focused on sustainable, long-term results."
